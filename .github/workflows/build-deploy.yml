
name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CampusConnect.sln

      - name: Build solution
        run: dotnet build CampusConnect.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CampusConnect.sln --configuration Release --no-build --verbosity normal

      - name: Publish web application
        run: dotnet publish CampusConnect.Web/CampusConnect.Web.csproj --configuration Release --no-restore --output ./publish
