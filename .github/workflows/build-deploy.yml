
name: Build and Deploy CampusConnect

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CampusConnect.sln

      - name: Build solution
        run: dotnet build CampusConnect.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CampusConnect.sln --configuration Release --no-build --verbosity normal

  deploy:
    needs: build-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish application
        run: dotnet publish CampusConnect.Web/CampusConnect.Web.csproj --configuration Release --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: CampusConnect
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
